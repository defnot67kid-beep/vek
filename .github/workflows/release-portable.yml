name: Build portable VEK release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64-portable:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VEK
        run: cmake -S . -B build -A x64 -DVEK_BUILD_TESTS=ON -DVEK_BUILD_C_ABI=ON -DVEK_PORTABLE_STATIC_MSVC_RUNTIME=ON

      - name: Build VEK
        run: cmake --build build --config Release --parallel

      - name: Test VEK
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install staging tree
        run: cmake --install build --config Release --prefix stage

      - name: Assemble relocatable package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag/version mismatch: tag=$env:GITHUB_REF_NAME VERSION=$version"
          }
          $root = Join-Path $PWD "VEK-v$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          Copy-Item "stage/bin/vek.exe" "$root/vek.exe"
          Copy-Item "stage/bin/VekInstaller.exe" "$root/VekInstaller.exe"
          if (Test-Path "stage/bin/vek.dll") { Copy-Item "stage/bin/vek.dll" "$root/vek.dll" }
          if (Test-Path "stage/lib") { Copy-Item "stage/lib" "$root/lib" -Recurse }
          Copy-Item "stage/include" "$root/include" -Recurse
          if (Test-Path "stage/share") { Copy-Item "stage/share" "$root/share" -Recurse }
          Copy-Item "examples" "$root/examples" -Recurse
          Copy-Item "docs" "$root/docs" -Recurse
          Copy-Item "VERSION","LICENSE","README.md","PORTABLE_RELEASE.md","RELEASE_NOTES_V2.2.0.md","INSTALL_PATH.cmd","UNINSTALL_PATH.cmd" $root

          $files = Get-ChildItem $root -File -Recurse | Where-Object { $_.Name -ne 'manifest.sha256' } | Sort-Object FullName
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            $rel = [IO.Path]::GetRelativePath($root, $f.FullName).Replace('\\','/')
            "$hash  $rel"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $root 'manifest.sha256')

          if (-not (Test-Path "$root/VekInstaller.exe")) { throw "VekInstaller.exe was not packaged" }
          & "$root/vek.exe" --version
          & "$root/vek.exe" info
          & "$root/vek.exe" doctor
          & "$root/vek.exe" verify

          Compress-Archive -Path $root -DestinationPath "$root.zip" -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 "$root.zip").Hash.ToLowerInvariant() + "  $([IO.Path]::GetFileName("$root.zip"))" | Set-Content -Encoding ascii "VEK-v$version-windows-x64.zip.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VEK-windows-x64-portable
          path: |
            VEK-v*-windows-x64.zip
            VEK-v*-windows-x64.zip.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "VEK-v$version-windows-x64.zip"
          $sum = "$zip.sha256"
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" $zip $sum --title "VEK Programming Language v$version" --generate-notes
          } else {
            gh release upload "v$version" $zip $sum --clobber
          }
