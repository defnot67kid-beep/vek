name: VEK Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Synchronize and validate version metadata
        shell: pwsh
        run: |
          python tools/version_manager.py sync
          python tools/version_manager.py check
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Git tag '${{ github.ref_name }}' does not match VERSION '$version'. Expected '$tag'."
          }
          "VEK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, test and package Windows runtime + installer
        shell: cmd
        run: BUILD_PORTABLE_WINDOWS.bat

      - name: Verify release assets exist
        shell: pwsh
        run: |
          $runtime = "VEK-v$env:VEK_VERSION-windows-x64.zip"
          foreach ($f in @($runtime, "$runtime.sha256", "VekInstaller.zip", "VekInstaller.zip.sha256", "release-version.json")) {
            if (-not (Test-Path $f)) { throw "Missing release asset: $f" }
          }

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            VEK-v${{ env.VEK_VERSION }}-windows-x64.zip
            VEK-v${{ env.VEK_VERSION }}-windows-x64.zip.sha256
            VekInstaller.zip
            VekInstaller.zip.sha256
            release-version.json
