name: Build VEK Windows x64 Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$version") { throw "Tag $tag does not match VERSION=$version" }
          }
          python tools/version_manager.py check

      - name: Build, test and package production Windows runtime
        shell: cmd
        run: BUILD_PORTABLE_WINDOWS.bat

      - name: Validate production release archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python tools/validate_release.py --package "VEK-v$version-windows-x64" --zip "VEK-v$version-windows-x64.zip" --version $version

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $assets = @(
            "VEK-v$version-windows-x64.zip",
            "VEK-v$version-windows-x64.zip.sha256",
            "VekInstaller.zip",
            "VekInstaller.zip.sha256",
            "release-version.json"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "VEK Programming Language v$version" --generate-notes @assets
          } else {
            gh release upload $tag @assets --clobber
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VEK-Windows-x64
          path: |
            VEK-v*-windows-x64.zip
            VEK-v*-windows-x64.zip.sha256
            VekInstaller.zip
            VekInstaller.zip.sha256
            release-version.json
